; Kinig pod. Same source as the Arduino IDE sketch in kinig_pod/.
; Needs Arduino-ESP32 3.x (ESP_I2S.h), which is the pioarduino platform.
;   cd firmware && pio run -t upload && pio device monitor

[platformio]
src_dir = kinig_pod

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
