<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinig notes</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0 auto;
      max-width: 40rem;
      padding: 1.25rem;
      line-height: 1.45;
      color: #1a1a1a;
      background: #f7f4ef;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
    h2 { font-size: 1.05rem; margin-bottom: 0.3rem; }
    .status {
      display: inline-block;
      font-weight: bold;
      padding: 0.15rem 0.5rem;
      background: #fff;
      border: 1px solid #ccc;
    }
    section { margin-top: 1.3rem; }
    pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
    #error:empty { display: none; }
    #error { color: #8a1f1f; }
  </style>
</head>
<body>
  <h1>Kinig notes</h1>
  <p>Status: <span id="status" class="status">[[status]]</span></p>
  <p id="error">[[error]]</p>
  <section>
    <h2>Summary</h2>
    <p id="summary">[[summary]]</p>
  </section>
  <section>
    <h2>Key points</h2>
    <ul id="key-points">[[key_points]]</ul>
  </section>
  <section>
    <h2>Action items</h2>
    <ul id="action-items">[[action_items]]</ul>
  </section>
  <section>
    <h2>Transcript</h2>
    <pre id="transcript">[[transcript]]</pre>
  </section>
  <script>
    // Same origin as this page. No CDN. Poll until the worker finishes.
    const pollUrl = "[[poll_url]]";
    const terminal = { done: true, error: true };

    function fill(data) {
      document.getElementById("status").textContent = data.status || "";
      document.getElementById("error").textContent = data.error || "";
      document.getElementById("summary").textContent = data.summary || "";
      document.getElementById("transcript").textContent = data.transcript || "";
      fillList("key-points", data.key_points);
      fillList("action-items", data.action_items);
    }

    function fillList(id, items) {
      const list = document.getElementById(id);
      list.replaceChildren();
      const values = items && items.length ? items : ["(none)"];
      for (const item of values) {
        const li = document.createElement("li");
        li.textContent = String(item);
        list.appendChild(li);
      }
    }

    async function poll() {
      try {
        const response = await fetch(pollUrl);
        if (!response.ok) return;
        const data = await response.json();
        fill(data);
        if (terminal[data.status]) return;
      } catch (err) {
        // Keep the last text on screen if the hub blips.
      }
      setTimeout(poll, 1000);
    }

    poll();
  </script>
</body>
</html>
