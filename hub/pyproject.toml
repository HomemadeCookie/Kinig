[project]
name = "kinig-hub"
version = "0.1.0"
description = "Offline edge hub for the Kinig meeting pod."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "qrcode>=8",
    "av>=12,<19",  # av 19 breaks faster-whisper 1.2.1 decode_audio (metadata_errors)
    "sounddevice>=0.5",
    "python-multipart>=0.0.9",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# kinig_hub/ sits next to this file. `pip install -e hub` from the repo root
# makes `import kinig_hub` work in scripts/ and in tests.
[tool.setuptools.packages.find]
where = ["."]
include = ["kinig_hub*"]

[tool.setuptools.package-data]
kinig_hub = ["web/templates/*.html", "web/static/dev/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
